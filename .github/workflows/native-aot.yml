name: NativeAOT

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: MojangAPI.AotSmoke
          - os: windows-latest
            rid: win-x64
            executable: MojangAPI.AotSmoke.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build both library targets
        run: dotnet build MojangAPI/MojangAPI.csproj -c Release
      - name: Run netstandard2.0 compatibility checks
        run: dotnet run --project tests/MojangAPI.LegacySmoke -c Release
      - name: Publish NativeAOT smoke test
        run: dotnet publish tests/MojangAPI.AotSmoke -c Release -r ${{ matrix.rid }} -o artifacts/aot
      - name: Run native smoke test
        shell: bash
        run: ./artifacts/aot/${{ matrix.executable }}
