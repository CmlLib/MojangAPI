name: NativeAOT

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build both library targets
        run: dotnet build MojangAPI/MojangAPI.csproj -c Release
      - name: Run netstandard2.0 compatibility checks
        run: dotnet run --project tests/MojangAPI.LegacySmoke -c Release
      - name: Publish NativeAOT smoke test
        run: dotnet publish tests/MojangAPI.AotSmoke -c Release -r linux-x64 -o artifacts/aot
      - name: Run native smoke test
        shell: bash
        run: ./artifacts/aot/MojangAPI.AotSmoke
